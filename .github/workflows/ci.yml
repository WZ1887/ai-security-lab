name: ci

on:
  push:
  pull_request:

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 只装跑测试与评测必需的东西：不装数据库驱动、不装模型客户端，
      # 因为测试与离线评测本来就不需要它们（backend/requirements.txt 是原开发机的完整快照）。
      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic pydantic-settings sqlalchemy httpx pyjwt bcrypt pytest

      - name: Unit & regression tests
        working-directory: backend
        env:
          DATABASE_URL: sqlite://
          APP_ENV: dev
        run: pytest -q

      - name: Attack-catalog evaluation (offline)
        working-directory: backend
        env:
          DATABASE_URL: sqlite://
          APP_ENV: dev
        run: |
          python -m eval.run_eval --markdown eval-report.md --json eval-report.json

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: |
            backend/eval-report.md
            backend/eval-report.json
